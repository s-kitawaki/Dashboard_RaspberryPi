<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="dashboard-container">
        <!-- ダッシュボード左側 -->
        <div class="panel left-panel">
            <!-- 時間表示パネル -->
            <div class="widget time-widget">
                <div class="date" id="date-display">--月--日(--)</div>
                <div class="time" id="time-container">
                    <div class="time-part" id="hour-display">--</div>
                    <div class="time-colon">:</div>
                    <div class="time-part" id="minute-display">--</div>
                    <div class="time-part second-part" id="second-display">--</div>
                </div>
            </div>

            <!-- カレンダーパネル -->
            <div class="widget calendar-widget">
                <div class="calendar-title" id="calendar-title">----年--月</div>
                <div class="calendar-container" id="calendar-container">
                    <!-- JSでカレンダーを追加 -->
                </div>
            </div>
        </div>

        <!-- ダッシュボード右側 -->
        <div class="panel right-panel">
            <!-- 天気予報パネル -->
            <div class="widget weather-widget">
                <div class="weather-content">
                    <i id="weather-icon" data-feather="cloud" class="icon-large"></i>
                    <div class="weather-details">
                        <div class="temperature"><span id="temperature-display">--</span>°C</div>
                        <div class="weather-sub">
                            <span class="condition" id="condition-display">取得中...</span>
                            <span class="humidity-wrap"> / <span id="humidity-display">--</span>%</span>
                        </div>
                    </div>
                </div>

                <!-- 3時間ごとの予報 -->
                <div class="forecast-container" id="forecast-container">
                    <!-- JSで動的に追加 -->
                </div>
            </div>

            <!-- 為替表示パネル -->
            <div class="widget currency-widget">
                <div class="currency-content">
                    <div class="currency-pair">USD / JPY</div>
                    <div class="currency-values">
                        <div class="currency-rate"><span id="exchange-rate-display">---.--</span><span
                                class="currency-unit">円</span></div>
                        <div class="currency-change" id="exchange-change-display">--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>

</html>
