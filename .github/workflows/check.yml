name: Check dashboard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            rp_weather/backend/package-lock.json
            rp_weather/frontend/package-lock.json
      - run: npm ci
        working-directory: rp_weather/backend
      - run: npm ci
        working-directory: rp_weather/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: rp_weather/frontend
      - run: pwsh -File ./rp_weather/scripts/check.ps1 -SkipInstall
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false && terraform fmt -check && terraform validate
        working-directory: rp_weather/infra
